<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>迷你版校园信息中心</title>
  <!-- Bootstrap 5.3.3 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- 自定义 CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 导航栏 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#home">迷你版校园信息中心</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navContent"
        aria-controls="navContent"
        aria-expanded="false"
        aria-label="切换导航"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#home">首页</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#study-room">自习室</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#stats">统计</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#campus-3d">校园三维</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <!-- 首页卡片区块 -->
    <section id="home">
      <h2>功能模块</h2>
      <div class="row g-3">
        <div class="col-12 col-md-6 col-xl-3">
          <a href="#home" class="text-decoration-none">
            <div class="card h-100">
              <div class="card-body text-center">
                <h5 class="card-title">首页</h5>
                <p class="card-text">平台入口。</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <a href="#study-room" class="text-decoration-none">
            <div class="card h-100">
              <div class="card-body text-center">
                <h5 class="card-title">自习室</h5>
                <p class="card-text">在线自习。</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <a href="#stats" class="text-decoration-none">
            <div class="card h-100">
              <div class="card-body text-center">
                <h5 class="card-title">统计</h5>
                <p class="card-text">数据统计。</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <a href="#campus-3d" class="text-decoration-none">
            <div class="card h-100">
              <div class="card-body text-center">
                <h5 class="card-title">校园三维</h5>
                <p class="card-text">三维校园。</p>
              </div>
            </div>
          </a>
        </div>
      </div>
    </section>

    <!-- 自习室占位 -->
    <section id="study-room" class="mt-5">
      <h2>自习室</h2>
      <p class="text-muted">自习室模块占位 · 待实现</p>
    </section>

    <!-- 统计占位 -->
    <section id="stats" class="mt-5">
      <h2>统计</h2>
      <p class="text-muted">统计模块占位 · 待实现</p>
    </section>

    <!-- 校园三维占位 -->
    <section id="campus-3d" class="mt-5">
      <h2>校园三维</h2>
      <p class="text-muted">校园三维模块占位 · 待实现</p>
    </section>
  </main>

  <!-- Bootstrap JS Bundle（含 Popper，支持导航折叠） -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
