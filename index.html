<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>迷你版校园信息中心</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- 导航栏 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#home">迷你版校园信息中心</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navContent"
        aria-controls="navContent"
        aria-expanded="false"
        aria-label="切换导航"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#home">首页</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#study-room">自习室</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#stats">统计</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#campus-3d">校园三维</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <!-- 首页卡片区块 -->
    <section id="home">
      <h2>功能模块</h2>
      <div class="row g-3">
        <div class="col-12 col-md-6 col-xl-3">
          <a href="#home" class="text-decoration-none">
            <div class="card h-100">
              <div class="card-body text-center">
                <h5 class="card-title">首页</h5>
                <p class="card-text">平台入口。</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <a href="#study-room" class="text-decoration-none">
            <div class="card h-100">
              <div class="card-body text-center">
                <h5 class="card-title">自习室</h5>
                <p class="card-text">在线自习。</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <a href="#stats" class="text-decoration-none">
            <div class="card h-100">
              <div class="card-body text-center">
                <h5 class="card-title">统计</h5>
                <p class="card-text">数据统计。</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <a href="#campus-3d" class="text-decoration-none">
            <div class="card h-100">
              <div class="card-body text-center">
                <h5 class="card-title">校园三维</h5>
                <p class="card-text">三维校园。</p>
              </div>
            </div>
          </a>
        </div>
      </div>
    </section>

    <!-- 自习室：楼层/开放状态筛选 -->
    <section id="study-room" class="mt-5">
      <h2>自习室</h2>
      <div class="row g-2 mb-3">
        <div class="col-auto">
          <label class="form-label">楼层</label>
          <select id="floorFilter" class="form-select form-select-sm">
            <option value="all">全部</option>
            <option value="1">1楼</option>
            <option value="2">2楼</option>
            <option value="3">3楼</option>
          </select>
        </div>
        <div class="col-auto">
          <label class="form-label">开放状态</label>
          <select id="openFilter" class="form-select form-select-sm">
            <option value="all">全部</option>
            <option value="true">开放</option>
            <option value="false">关闭</option>
          </select>
        </div>
      </div>
      <ul id="roomList" class="list-group"></ul>
    </section>

    <!-- 统计：各自习室使用量柱状图 -->
    <section id="stats" class="mt-5">
      <h2>统计</h2>
      <p class="mb-1"><strong>各自习室使用量</strong>（单位：人次）</p>
      <p class="text-muted small">数据来源：data.json</p>
      <canvas id="usageChart" height="120"></canvas>
    </section>

    <!-- 校园三维占位 -->
    <section id="campus-3d" class="mt-5">
      <h2>校园三维</h2>
      <p class="text-muted">校园三维模块占位 · 待实现</p>
    </section>
  </main>

  <!-- Bootstrap JS Bundle（含 Popper，支持导航折叠） -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ===== 自习室数据（写死在JS数组） =====
    const rooms = [
      { name: "A101", floor: 1, open: true },
      { name: "A102", floor: 1, open: false },
      { name: "B201", floor: 2, open: true },
      { name: "B202", floor: 2, open: true },
      { name: "C301", floor: 3, open: true },
      { name: "C302", floor: 3, open: false }
    ];

    function renderRooms() {
      const floor = document.getElementById("floorFilter").value;
      const open = document.getElementById("openFilter").value;
      const list = document.getElementById("roomList");
      const filtered = rooms.filter(r =>
        (floor === "all" || String(r.floor) === floor) &&
        (open === "all" || String(r.open) === open)
      );
      list.innerHTML = filtered.map(r =>
        `<li class="list-group-item d-flex justify-content-between">
          <span>${r.name}（${r.floor}楼）</span>
          <span class="${r.open ? 'text-success' : 'text-secondary'}">
            ${r.open ? '开放' : '关闭'}
          </span>
        </li>`
      ).join("") || '<li class="list-group-item text-muted">无匹配自习室</li>';
    }

    document.getElementById("floorFilter").addEventListener("change", renderRooms);
    document.getElementById("openFilter").addEventListener("change", renderRooms);
    renderRooms();

    // ===== 统计图表：加载 data.json 渲染柱状图 =====
    fetch("data.json")
      .then(res => res.json())
      .then(data => {
        new Chart(document.getElementById("usageChart"), {
          type: "bar",
          data: {
            labels: data.map(d => d.name),
            datasets: [{
              label: "使用量（人次）",
              data: data.map(d => d.usage),
              backgroundColor: "#0d6efd"
            }]
          },
          options: {
            plugins: {
              title: { display: true, text: "各自习室使用量" },
              legend: { display: false }
            },
            scales: {
              y: { beginAtZero: true, title: { display: true, text: "人次" } }
            }
          }
        });
      })
      .catch(err => console.error("加载 data.json 失败：", err));
  </script>
</body>
</html>
